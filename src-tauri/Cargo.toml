[package]
name = "longplay"
version = "0.1.0"
description = "A skeuomorphic turntable for a local music library"
authors = ["Kyrion"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "longplay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.25.5"
walkdir = "2.5.1"
thiserror = "2.0.21"
blake3 = "1.8.7"
rusqlite = { version = "0.43.0", features = ["bundled"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
tauri-plugin-dialog = "2.8.4"
symphonia = { version = "0.6.1", default-features = false, features = ["aac", "adpcm", "aiff", "alac", "flac", "isomp4", "mp3", "ogg", "opt-simd", "pcm", "vorbis", "wav"] }
arc-swap = "1.9.5"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(not(target_os = "linux"))'.dependencies]
cpal = "0.18.2"
